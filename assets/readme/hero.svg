<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Dispute Shield</title>
  <desc id="desc">Dispute Shield answers PayPal disputes with evidence where every sentence cites your records and passes a verifier; you approve the exact request before anything is sent. Example: a delivery statement citing fulfil.delivered_at is verified, while "The buyer confirmed receipt" is removed because no record says it.</desc>

  <rect width="1200" height="420" rx="24" fill="#f5f7f7"/>

  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="0" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="1.5" fill="#535f66">PAYPAL SANDBOX · AI EVIDENCE DESK</text>
    <rect x="0" y="116" width="64" height="64" rx="14" fill="#2a5bd7"/>
    <text x="32" y="159" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">DS</text>
    <text x="84" y="168" font-size="58" font-weight="800" fill="#2b363c">Dispute Shield</text>
    <text font-size="26" fill="#535f66">
      <tspan x="0" y="236">Answers PayPal disputes with evidence</tspan>
      <tspan x="0" y="272">where every sentence cites your records</tspan>
      <tspan x="0" y="308">and passes a verifier. You approve the</tspan>
      <tspan x="0" y="344">exact request before anything is sent.</tspan>
    </text>
  </g>

  <g id="project-proof" transform="translate(680 52)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <rect x="4" y="8" width="456" height="316" rx="16" fill="#03005c" opacity="0.06"/>
    <rect width="456" height="316" rx="16" fill="#ffffff" stroke="#e3e8ea"/>
    <text x="28" y="46" font-size="22" font-weight="700" fill="#2b363c">Evidence draft</text>
    <rect x="214" y="22" width="136" height="34" rx="17" fill="#e8f6ee"/>
    <text x="282" y="45" text-anchor="middle" font-size="18" font-weight="600" fill="#177245">✓ Verified</text>

    <g id="accepted">
      <rect x="24" y="74" width="408" height="134" rx="10" fill="#ffffff" stroke="#e3e8ea"/>
      <text font-size="20" fill="#2b363c">
        <tspan x="42" y="106">The item was delivered on 2026-10-09</tspan>
        <tspan x="42" y="134">per the seller's fulfilment records.</tspan>
      </text>
      <rect x="42" y="152" width="214" height="34" rx="6" fill="#f0f4ff" stroke="#dbe3f5"/>
      <text x="54" y="175" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#2b363c">fulfil.delivered_at</text>
    </g>

    <g id="rejected">
      <rect x="24" y="222" width="408" height="74" rx="10" fill="#fdecec"/>
      <text x="42" y="252" font-size="20" fill="#535f66">The buyer confirmed receipt.</text>
      <line x1="42" y1="245" x2="295" y2="245" stroke="#c0302b" stroke-width="2"/>
      <text x="42" y="280" font-size="18" font-weight="600" fill="#c0302b">✕ Removed: no record says this</text>
    </g>
  </g>
</svg>
