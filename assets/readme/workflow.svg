<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-labelledby="title desc">
  <title id="title">How Dispute Shield builds a response</title>
  <desc id="desc">Five steps: PayPal sandbox records are turned into facts that keep their source and JSON path; the AI drafts from facts only; the verifier checks every number, date and ID against the cited facts and falls back to a template after two failures; you approve the exact request, which is stored as a dry run or sent to the sandbox.</desc>

  <rect width="1200" height="290" rx="24" fill="#f5f7f7"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <g id="step-paypal" transform="translate(48 36)">
      <rect width="198" height="176" rx="12" fill="#ffffff" stroke="#e3e8ea"/>
      <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#535f66">01</text>
      <text x="20" y="76" font-size="22" font-weight="700" fill="#2b363c">PayPal</text>
      <text font-size="20" fill="#535f66"><tspan x="20" y="112">Dispute, order,</tspan><tspan x="20" y="140">payment and</tspan><tspan x="20" y="168">tracking records</tspan></text>
    </g>
    <g id="step-facts" transform="translate(274 36)">
      <rect width="198" height="176" rx="12" fill="#ffffff" stroke="#e3e8ea"/>
      <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#535f66">02</text>
      <text x="20" y="76" font-size="22" font-weight="700" fill="#2b363c">Facts</text>
      <text font-size="20" fill="#535f66"><tspan x="20" y="112">Each keeps its</tspan><tspan x="20" y="140">source record</tspan><tspan x="20" y="168">and JSON path</tspan></text>
    </g>
    <g id="step-draft" transform="translate(500 36)">
      <rect width="198" height="176" rx="12" fill="#ffffff" stroke="#e3e8ea"/>
      <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#535f66">03</text>
      <text x="20" y="76" font-size="22" font-weight="700" fill="#2b363c">AI draft</text>
      <text font-size="20" fill="#535f66"><tspan x="20" y="112">Sees facts, not</tspan><tspan x="20" y="140">payloads; cites</tspan><tspan x="20" y="168">a key per line</tspan></text>
    </g>
    <g id="step-verifier" transform="translate(726 36)">
      <rect width="198" height="176" rx="12" fill="#f0f4ff" stroke="#2a5bd7" stroke-width="2"/>
      <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#2a5bd7">04</text>
      <text x="20" y="76" font-size="22" font-weight="700" fill="#2b363c">Verifier</text>
      <text font-size="20" fill="#2b363c"><tspan x="20" y="112">Numbers, dates</tspan><tspan x="20" y="140">and IDs must</tspan><tspan x="20" y="168">match the cites</tspan></text>
    </g>
    <g id="step-approve" transform="translate(952 36)">
      <rect width="198" height="176" rx="12" fill="#ffffff" stroke="#e3e8ea"/>
      <text x="20" y="38" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#535f66">05</text>
      <text x="20" y="76" font-size="22" font-weight="700" fill="#2b363c">You approve</text>
      <text font-size="20" fill="#535f66"><tspan x="20" y="112">The exact</tspan><tspan x="20" y="140">request: dry run</tspan><tspan x="20" y="168">or sandbox</tspan></text>
    </g>

    <g id="arrows" fill="none" stroke="#535f66" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M252 124h16m-6 -6l6 6l-6 6"/>
      <path d="M478 124h16m-6 -6l6 6l-6 6"/>
      <path d="M704 124h16m-6 -6l6 6l-6 6"/>
      <path d="M930 124h16m-6 -6l6 6l-6 6"/>
    </g>

    <g id="fallback">
      <path d="M825 214v22" fill="none" stroke="#535f66" stroke-width="2" stroke-dasharray="4 4"/>
      <text x="825" y="262" text-anchor="middle" font-size="18" fill="#535f66">fails twice → plain template</text>
    </g>
  </g>
</svg>
